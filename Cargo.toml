[workspace]
resolver = "2"
members = [
  "crates/nm-core",
  "crates/nm-api",
  "crates/nm-audio",
  "crates/nm-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
# 非商业共享许可证，全文见 LICENSE
license = "LicenseRef-Montis-NonCommercial-ShareAlike-1.0"
rust-version = "1.80"
authors = ["Montis"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "json"] }
aes = "0.8"
cbc = "0.1"
cipher = { version = "0.4", features = ["alloc", "block-padding"] }
base64 = "0.22"
num-bigint = "0.4"
rand = "0.8"
dirs = "5"
image = { version = "0.24", default-features = false, features = ["png", "jpeg"] }
iced = { version = "0.13", features = ["tokio", "svg", "image", "advanced", "canvas"] }
rodio = { version = "0.19", features = ["symphonia-aac", "symphonia-isomp4"] }
rustfft = "6.4"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
