[workspace]
resolver = "2"
members = [
  "crates/nm-core",
  "crates/nm-api",
  "crates/nm-audio",
  "crates/nm-app",
]
# 打了输入法补丁的 iced_winit（见 vendor/iced_winit 里的注释）。
exclude = ["vendor/iced_winit"]

# iced 0.13 完全没有输入法支持：`iced_winit` 会把 winit 的 `Ime` 事件丢掉，
# 也从不调用 `set_ime_allowed`，导致中文输入法在输入框里不可用。
# 这里用一份最小补丁的 iced_winit 替换官方 crate（其余 iced 组件仍用 0.13）。
[patch.crates-io]
iced_winit = { path = "vendor/iced_winit" }

[workspace.package]
version = "0.1.0"
edition = "2021"
# 非商业共享许可证，全文见 LICENSE
license = "LicenseRef-Montis-NonCommercial-ShareAlike-1.0"
rust-version = "1.80"
authors = ["Montis"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "json"] }
md-5 = "0.10"
aes = "0.8"
cbc = "0.1"
cipher = { version = "0.4", features = ["alloc", "block-padding"] }
base64 = "0.22"
num-bigint = "0.4"
rand = "0.8"
dirs = "5"
image = { version = "0.24", default-features = false, features = ["png", "jpeg"] }
iced = { version = "0.13", features = ["tokio", "svg", "image", "advanced", "canvas"] }
rodio = { version = "0.19", features = ["symphonia-aac", "symphonia-isomp4"] }
rustfft = "6.4"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
